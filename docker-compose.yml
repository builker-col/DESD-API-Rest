services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-desd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-desd}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      API_LISTEN_ADDR: ":5000"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-desd.dlx}
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-desd}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_secret_key}
      CONVERTER_DPI: ${CONVERTER_DPI:-150}
      CONVERTER_MAX_DIM: ${CONVERTER_MAX_DIM:-960}
      CONVERTER_JPEG_QUALITY: ${CONVERTER_JPEG_QUALITY:-85}
      CONVERTER_FAST_PDFIMAGES: ${CONVERTER_FAST_PDFIMAGES:-1}
      CONVERTER_PDF_CHUNK_SIZE: ${CONVERTER_PDF_CHUNK_SIZE:-8}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-4}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-queue_worker}
      DUPLICATE_QUEUE_NAME: ${DUPLICATE_QUEUE_NAME:-queue_dude}
      SHARED_DATA_DIR: /shared-data
      HOTFOLDER_ENABLED: ${HOTFOLDER_ENABLED:-true}
      HOTFOLDER_ROOT: /hotfolder
      HOTFOLDER_POLL_INTERVAL: ${HOTFOLDER_POLL_INTERVAL:-0.5}
      HOTFOLDER_DEFAULT_USER: ${HOTFOLDER_DEFAULT_USER:-admin}
    volumes:
      - shared-data:/shared-data
      - ./hotfolder:/hotfolder
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/desd-api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-desd.dlx}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-8}
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-desd}
      QUEUE_NAME: ${WORKER_QUEUE_NAME:-queue_worker}
      MODELS_DIR: /models
      ENABLED_MODELS: ${ENABLED_MODELS:-cude,rode,legibility,tilde}
      WORKER_PREFETCH_THREADS: ${WORKER_PREFETCH_THREADS:-2}
      WORKER_DB_BATCH_SIZE: ${WORKER_DB_BATCH_SIZE:-8}
      WORKER_DB_FLUSH_WINDOW_MS: ${WORKER_DB_FLUSH_WINDOW_MS:-15}
    volumes:
      - ./models:/models:ro
      - shared-data:/shared-data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  duplicate:
    build:
      context: ./services/duplicate
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-desd.dlx}
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-desd}
      QUEUE_NAME: ${DUPLICATE_QUEUE_NAME:-queue_dude}
      DUPLICATE_SSIM_MAX_DIM: ${DUPLICATE_SSIM_MAX_DIM:-512}
    volumes:
      - shared-data:/shared-data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  shared-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2g,mode=1777"
  postgres-data:
