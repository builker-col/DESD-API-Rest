syntax = "proto3";

// Paquete del servicio Converter
package converter;

// Servicio de conversión de documentos a imágenes JPEG.
//
// - Soporta PDF y TIFF/TIF como entrada.
// - Devuelve una lista de imágenes JPEG en memoria (bytes).
// - El orden de las imágenes corresponde al orden de páginas del documento.
service Converter {
  // Convierte un archivo (file_content, file_name) en imágenes JPEG.
  rpc ConvertFile(ConvertRequest) returns (ConvertResponse);
}

// Solicitud de conversión
message ConvertRequest {
  // Contenido del archivo en bytes (PDF/TIFF)
  bytes file_content = 1;
  // Nombre del archivo, usado para inferir el tipo (extensión)
  string file_name = 2;
}

// Respuesta con las imágenes resultantes
message ConvertResponse {
  // Lista de imágenes JPEG (bytes) en el orden de páginas
  repeated bytes images = 1;
}